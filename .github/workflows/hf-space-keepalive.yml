name: Keep Hugging Face Space Alive

on:
  schedule:
    # Run every 12 hours.
    # GitHub Actions cron uses UTC time.
    - cron: "17 5,17 * * *"

  workflow_dispatch:

jobs:
  ping-space:
    runs-on: ubuntu-latest

    env:
      SPACE_URL: "https://severus-deng-eeg-dim-visualizer-api.hf.space/"
      SUCCESS_TO: "stark.yangfan@gmail.com"
      FAILURE_TO: "yfandeng@umd.edu"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Restore success counter
        uses: actions/cache/restore@v4
        with:
          path: .hf-ping-state
          key: hf-ping-state-${{ github.run_id }}
          restore-keys: |
            hf-ping-state-

      - name: Ping Hugging Face Space
        shell: bash
        run: |
          mkdir -p .hf-ping-state
          COUNT_FILE=".hf-ping-state/success_count"

          if [ ! -f "$COUNT_FILE" ]; then
            echo "0" > "$COUNT_FILE"
          fi

          send_mail () {
            TO="$1"
            SUBJECT="$2"
            BODY="$3"

            printf "From: %s\nTo: %s\nSubject: %s\n\n%b\n" \
              "$SMTP_USERNAME" "$TO" "$SUBJECT" "$BODY" > /tmp/mail.txt

            curl --url "smtps://smtp.gmail.com:465" \
              --ssl-reqd \
              --mail-from "$SMTP_USERNAME" \
              --mail-rcpt "$TO" \
              --user "$SMTP_USERNAME:$SMTP_PASSWORD" \
              --upload-file /tmp/mail.txt
          }

          echo "Current success count:"
          cat "$COUNT_FILE"

          echo "Pinging Hugging Face Space:"
          echo "$SPACE_URL"

          if curl -L --fail --silent --show-error --max-time 180 --retry 2 --retry-delay 30 "$SPACE_URL" > /tmp/hf_response.txt; then
            echo "Ping succeeded."

            COUNT=$(cat "$COUNT_FILE")
            COUNT=$((COUNT + 1))

            if [ "$COUNT" -ge 4 ]; then
              echo "Reached 4 successful pings. Sending success email."

              SUCCESS_BODY="The EEG-DIM Visualizer API has been successfully reached 4 consecutive times over approximately 48 hours.\n\nSpace URL:\n${SPACE_URL}\n\nThis means the scheduled keep-alive workflow is working."

              send_mail "$SUCCESS_TO" \
                "Hugging Face Space keep-alive succeeded for 48 hours" \
                "$SUCCESS_BODY"

              COUNT=0
            fi

            echo "$COUNT" > "$COUNT_FILE"
            echo "Updated success count:"
            cat "$COUNT_FILE"

          else
            echo "Ping failed."
            echo "0" > "$COUNT_FILE"

            FAILURE_BODY="The EEG-DIM Visualizer API could not be reached.\n\nSpace URL:\n${SPACE_URL}\n\nPlease check the Hugging Face Space status."

            send_mail "$FAILURE_TO" \
              "Hugging Face Space keep-alive failed" \
              "$FAILURE_BODY"

            exit 1
          fi

      - name: Save success counter
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hf-ping-state
          key: hf-ping-state-${{ github.run_id }}
